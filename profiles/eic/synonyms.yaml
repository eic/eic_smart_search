# Domain acronym -> expansion, applied as an extra query variant.
tdr: "technical design report"
pretdr: "preliminary technical design report"
esr: "early science report"
svt: "silicon vertex tracker"
tof: "time of flight"
zdc: "zero degree calorimeter"
bic: "barrel imaging calorimeter"
lfhcal: "longitudinally segmented forward hadronic calorimeter"
nhcal: "backward hadronic calorimeter"
sidis: "semi-inclusive deep inelastic scattering"
dis: "deep inelastic scattering"
pid: "particle identification"
daq: "data acquisition streaming readout"
pwg: "physics working group"
dqm: "data quality monitoring"
mpgd: "micro pattern gaseous detector"
# Detector-name aliases: geometry names (compact/definitions.xml) vs the
# collaboration's colloquial names. EndcapP = positive z = forward =
# hadron-going side; EndcapN = negative z = backward = electron-going side.
hcalendcapn: "backward hadronic calorimeter nHCal negative endcap"
ecalendcapn: "backward electromagnetic calorimeter EEMC negative endcap"
hcalendcapp: "forward hadronic calorimeter LFHCAL positive endcap"
ecalendcapp: "forward electromagnetic calorimeter FEMC positive endcap"
eemc: "backward electromagnetic calorimeter EcalEndcapN"
femc: "forward electromagnetic calorimeter EcalEndcapP"
ehcal: "backward hadronic calorimeter HcalEndcapN nHCal"
fhcal: "forward hadronic calorimeter HcalEndcapP LFHCAL"
pfrich: "proximity focusing RICH backward BackwardRICH"
drich: "dual radiator RICH forward ForwardRICH"
