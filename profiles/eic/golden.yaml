# Regression, two bugs at once: (a) plainto_tsquery AND semantics zeroed
# out lexical search ("many" -> 'mani' is not a stopword), so the design
# chunk never reached the LLM; (b) the model then presented the 32-layer
# TEST-BEAM prototype as the design. Design truth: 60 layers (Forward_Hcal
# wiki page). Keep the exact filler-word phrasing — it is the trigger.
- id: lfhcal-layers
  query: "how many layers in lfhcal?"
  expect_url_contains: ["Forward_Hcal", "wiki.bnl.gov"]
  expect_answer_contains: ["60"]
  tags: [detector, facts]

