# Curated directory of live EIC/ePIC services and tools.
#
# Ingested as first-class documents (source: eic_services) so questions
# like "hydra monitoring" or "event display" retrieve the entry and the
# answer leads with the DIRECT link to the running service.
#
# Fields: name, url (the direct service link), description (what it is,
# when to use it), aliases (extra retrieval vocabulary). Add entries here
# whenever a "where is the X service" question fails.

- name: Hydra monitoring
  url: https://epsciweb.jlab.org/epic_hydra/allPlotsBrowser
  description: >
    Hydra is the AI/ML-based online data-quality monitoring system for the
    ePIC experiment, developed by the JLab EPSCI group. The all-plots
    browser shows near-real-time monitoring plots classified by the Hydra
    ML models. Use it to inspect current detector data-quality plots.
  aliases: [hydra, data quality monitoring, DQM, online monitoring, monitoring plots, plot browser, AI monitoring]

- name: ePIC event display (Firebird)
  url: https://seeeic.org/display
  description: >
    Firebird is the web-based interactive 3D event display for the ePIC
    detector. Open it in the browser to visualize simulated and
    reconstructed events in the ePIC geometry. Source code lives in the
    eic/firebird repository on GitHub.
  aliases: [event display, firebird, 3d event viewer, visualize events, see eic, event visualization]

- name: Simulation production campaigns (epic-prod)
  url: https://eic.github.io/epic-prod/
  description: >
    Documentation hub for the official ePIC simulation production
    campaigns: campaign lists per reconstruction release (RECO), dataset
    locations on S3/XRootD, campaign configurations, and production
    status. Start here to find which campaigns exist and where their
    output files live.
  aliases: [productions, production campaigns, simulation campaigns, campaign datasets, RECO campaigns, epic-prod, monthly campaign]

- name: ePIC Indico (meetings)
  url: https://indico.bnl.gov/category/402/
  description: >
    The ePIC Indico category at BNL hosting all collaboration, working
    group, and subsystem meeting agendas, slides and recordings.
  aliases: [indico, meeting agendas, meeting calendar]

- name: ePIC Mattermost chat
  url: https://chat.epic-eic.org/
  description: >
    The ePIC collaboration's Mattermost workspace — real-time chat
    channels per working group and subsystem. Requires a collaboration
    account.
  aliases: [mattermost, chat, slack, messaging]

- name: ePIC wiki
  url: https://wiki.bnl.gov/EPIC/
  description: >
    The ePIC MediaWiki at BNL: working group pages, detector subsystem
    design pages, test-beam documentation, and technical notes.
  aliases: [wiki, bnl wiki, epic wiki]

- name: ePIC document database (Zenodo)
  url: https://zenodo.org/communities/epic/
  description: >
    The ePIC Zenodo community — the collaboration's document database for
    presentations, proceedings, technical documents and the TDR line of
    documents, each with a citable DOI.
  aliases: [zenodo, document database, docdb, publications archive]

- name: EIC software on GitHub
  url: https://github.com/eic
  description: >
    The eic GitHub organization hosting the ePIC software stack:
    detector geometry (epic), reconstruction (EICrecon), simulation
    tools (npsim), the software environment (eic-shell), and more.
  aliases: [github, source code, repositories, software repos]

- name: eic-shell installer
  url: https://get.epic-eic.org
  description: >
    One-line installer for eic-shell, the containerized EIC software
    environment. Run "curl --location https://get.epic-eic.org | bash"
    to install.
  aliases: [eic-shell download, install eic-shell, container installer]

- name: ePIC collaboration website
  url: https://www.epic-eic.org/
  description: >
    The public ePIC collaboration website: collaboration structure,
    working groups and conveners, documents, collaborative tools, and
    news.
  aliases: [collaboration website, epic website, collaboration pages]

- name: EIC GitLab (eicweb)
  url: https://eicweb.phy.anl.gov/EIC
  description: >
    The EIC GitLab instance at ANL, hosting continuous-integration
    infrastructure, benchmark pipelines, and some detector repositories.
  aliases: [gitlab, eicweb, benchmarks CI]

- name: ePIC preliminary Technical Design Report (preTDR)
  url: https://zenodo.org/records/18271601
  description: >
    The ePIC Detector Preliminary Technical Design Report — the
    collaboration's principal design document, hosted on Zenodo. This
    concept link always resolves to the LATEST version of the report
    (currently Version 3.1). Cite and share this link when someone asks
    for the TDR / preTDR / technical design report.
  aliases: [TDR, preTDR, pre-TDR, technical design report, design report, detector design document]
