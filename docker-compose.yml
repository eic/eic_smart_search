services:
  api:
    build: .
    image: eic-smart-search:latest
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://smartsearch:smartsearch@postgres:5432/smartsearch
      QDRANT_URL: http://qdrant:6333
      # Cap glibc malloc arenas: long-running worker with numpy/torch churn
      # fragments badly under the default (8*cores) and reads as a leak.
      MALLOC_ARENA_MAX: "2"
    # GPU access is optional — see docker-compose.gpu.yml (make up-gpu).
    # NOTE: production-safe defaults (no --reload, no source bind-mount).
    # For hot-reload development use: make dev  (adds docker-compose.dev.yml).
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 90s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartsearch
      POSTGRES_PASSWORD: smartsearch
      POSTGRES_DB: smartsearch
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartsearch -d smartsearch"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    restart: unless-stopped
    volumes:
      - ./qdrant_data:/qdrant/storage
