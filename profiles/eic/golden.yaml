# Golden evaluation set for the EIC smart-search stack.
#
# Each case:
#   id                     stable identifier (shown in the eval dashboard)
#   query                  what a real user would type
#   expect_url_contains    retrieval passes when ANY top-k citation URL
#                          contains ANY of these substrings
#   expect_answer_contains (optional) generated answer must contain ALL of
#                          these substrings (case-insensitive)
#   tags                   free-form grouping for the dashboard
#
# Add cases when a real query fails — that failure becomes the regression test.

- id: tutorials-run
  query: "How do I run simulation tutorials?"
  expect_url_contains: ["eic.github.io/tutorial", "eic.github.io/documentation"]
  expect_answer_contains: ["tutorial"]
  tags: [docs, howto]

